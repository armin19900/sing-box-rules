name: Compile sing-box SRS

on:
  push:
    paths:
      - '**.json' # 只要任何 json 文件被修改，就触发编译
  workflow_dispatch: # 允许手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install sing-box
        run: |
          go install ://github.com

      - name: Compile JSON to SRS
        run: |
          # 自动寻找仓库里的所有 json 文件并编译成同名的 srs 文件
          for file in *.json; do
            if [ -f "$file" ]; then
              filename="${file%.*}"
              ~/go/bin/sing-box rule-set compile "$file" -o "${filename}.srs"
            fi
          done

      - name: Commit and Push SRS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.srs
          # 只有在 srs 文件有变化时才提交，防止死循环
          git diff --staged --quiet || git commit -m "Auto-compiled srs rule-sets"
          git push
