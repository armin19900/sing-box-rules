name: Compile sing-box SRS

on:
  push:
    paths:
      - '**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download sing-box Tool
        run: |
          curl -Lo sb.tar.gz https://github.com
          tar -xzf sb.tar.gz
          mv sing-box-*linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box

      - name: Compile JSON to SRS
        run: |
          for file in *.json; do
            if [ -f "$file" ]; then
              filename="${file%.*}"
              ./sing-box rule-set compile "$file" -o "${filename}.srs"
            fi
          done

      - name: Commit and Push SRS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add *.srs
          git diff --staged --quiet || git commit -m "Auto-compiled srs rule-sets"
          git push
