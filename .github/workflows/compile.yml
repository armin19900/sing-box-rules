name: Compile sing-box SRS

on:
  push:
    paths:
      - '**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install sing-box
        run: |
          go install ://github.com

      - name: Compile JSON to SRS
        run: |
          for file in *.json; do
            if [ -f "$file" ]; then
              filename="${file%.*}"
              ~/go/bin/sing-box rule-set compile "$file" -o "${filename}.srs"
            fi
          done

      - name: Commit and Push SRS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add *.srs
          git diff --staged --quiet || git commit (m) "Auto-compiled srs rule-sets"
          git push
